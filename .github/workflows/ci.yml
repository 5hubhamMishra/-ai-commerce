name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Verify API
        run: |
          npm test --workspace=apps/api -- --runInBand
          npm run lint --workspace=apps/api -- --no-fix
          npm run build --workspace=apps/api

      - name: Verify web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
          NEXT_PUBLIC_ALLOW_DEMO_FALLBACK: true
        run: |
          npm test --workspace=apps/web
          npm run lint --workspace=apps/web
          npm run build --workspace=apps/web

      - name: Verify mobile
        run: |
          npm test --workspace=apps/mobile -- --runInBand
          npm run lint --workspace=apps/mobile
          npm run typecheck --workspace=apps/mobile

  api-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ai_commerce:ai_commerce_test@localhost:5432/ai_commerce
      DIRECT_URL: postgresql://ai_commerce:ai_commerce_test@localhost:5432/ai_commerce
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:3000,http://localhost:3100,http://127.0.0.1:3100
      JWT_ACCESS_SECRET: ci-access-secret-012345678901234567890123
      JWT_REFRESH_SECRET: ci-refresh-secret-012345678901234567890123
      ANTHROPIC_API_KEY: ci-anthropic-key-placeholder
      EMBEDDING_PROVIDER: hashing
      PAYMENT_PROVIDER: development
      THROTTLE_DEFAULT_LIMIT: 1000
      NEXT_PUBLIC_ALLOW_DEMO_FALLBACK: true

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ai_commerce
          POSTGRES_PASSWORD: ai_commerce_test
          POSTGRES_DB: ai_commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_commerce -d ai_commerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply test migrations
        run: npm run db:migrate

      - name: Seed test catalog
        run: npm run prisma:seed --workspace=apps/api

      - name: Run API end-to-end suite
        run: npm run test:e2e --workspace=apps/api -- --runInBand

      - name: Build API for browser tests
        run: npm run build --workspace=apps/api

      - name: Start API for browser tests
        run: |
          nohup npm run start:prod --workspace=apps/api >/tmp/veloura-api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/veloura-api.log
          exit 1

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run web end-to-end suite
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
          NEXT_PUBLIC_ALLOW_DEMO_FALLBACK: true
        run: npm run test:e2e --workspace=apps/web

      - name: Print API log on browser-test failure
        if: ${{ failure() }}
        run: test -f /tmp/veloura-api.log && cat /tmp/veloura-api.log || true
